    <section class="section page-head">
      <div class="wrap">
        <h1 class="page-title">{{work_h1}}</h1>
        <p class="page-lead">{{work_lead}}</p>
      </div>
    </section>

    <section class="section work">
      <div class="wrap">
        <article class="case">
          <a class="case__media shots" href="{{base}}demos/holvi/index.html" tabindex="-1">
            <span class="frame">
              <span class="frame__bar">jnwebdesign.com/demos/holvi</span>
              <img src="{{base}}assets/img/shot-holvi-desktop.jpg" width="1440" height="900" alt="{{hv_alt_desktop}}">
            </span>
            <img class="phone" src="{{base}}assets/img/shot-holvi-phone.jpg" width="780" height="1688" alt="{{hv_alt_phone}}">
          </a>
          <div class="case__text">
            <h2 class="case__title">{{hv_title}}</h2>
            <p>{{hv_text}}</p>
            <ul class="case__points">
              <li>{{hv_1}}</li>
              <li>{{hv_2}}</li>
              <li>{{hv_3}}</li>
            </ul>
            <a class="btn btn--primary" href="{{base}}demos/holvi/index.html">{{hv_open}}</a>
            <p class="case__note">{{hv_note}}</p>
          </div>
        </article>
        <article class="case">
          <a class="case__media shots" href="{{base}}demos/g-class/index.html" tabindex="-1">
            <span class="frame">
              <span class="frame__bar">jnwebdesign.com/demos/g-class</span>
              <img src="{{base}}assets/img/shot-gclass-desktop.jpg" width="1440" height="900" alt="{{shot_alt_desktop}}">
            </span>
            <img class="phone" src="{{base}}assets/img/shot-gclass-phone.jpg" width="780" height="1688" alt="{{shot_alt_phone}}">
          </a>
          <div class="case__text">
            <h2 class="case__title">{{gc_title}}</h2>
            <p>{{gc_text}}</p>
            <ul class="case__points">
              <li>{{gc_1}}</li>
              <li>{{gc_2}}</li>
              <li>{{gc_3}}</li>
            </ul>
            <a class="btn btn--primary" href="{{base}}demos/g-class/index.html">{{gc_open}}</a>
            <p class="case__note">{{gc_note}}</p>
          </div>
        </article>
        <p class="work__more">{{work_more}}</p>
      </div>
    </section>

{{cta_band}}
