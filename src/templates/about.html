    <section class="section about">
      <div class="wrap about__grid">
        <div class="about__text">
          <h1 class="page-title">{{about_h1}}</h1>
          <p class="page-lead">{{about_p1}}</p>
          <p>{{about_p2}}</p>
          <p>{{about_p3}}</p>
          <div class="about__actions">
            <a class="btn btn--primary" href="work.html">{{about_btn_work}}</a>
            <a class="btn btn--ghost" href="contact.html">{{cta_btn}}</a>
          </div>
        </div>
        <div class="about__side">
        <figure class="about__photo">
          <img src="{{base}}assets/img/helsinki-900.jpg"
               srcset="{{base}}assets/img/helsinki-900.jpg 900w, {{base}}assets/img/helsinki-1600.jpg 1600w"
               sizes="(min-width: 860px) 34vw, 100vw" width="1600" height="1075"
               alt="{{about_photo_alt}}">
          <figcaption><a href="https://unsplash.com/photos/white-and-blue-mosque-among-buildings-For4352Fgwg">{{about_photo_credit}}</a></figcaption>
        </figure>
        <dl class="facts">
          <div><dt>{{about_k1}}</dt><dd>{{about_v1}}</dd></div>
          <div><dt>{{about_k2}}</dt><dd>{{about_v2}}</dd></div>
          <div><dt>{{about_k3}}</dt><dd>{{about_v3}}</dd></div>
        </dl>
        </div>
      </div>
    </section>
